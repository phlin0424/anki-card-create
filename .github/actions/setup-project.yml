name: "Setup UV and Python"
description: "Checks out code and sets up uv with caching"

runs:
  using: "composite"
  steps:
    - name: Check out
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Set up Python
      shell: bash
      run: uv python install 3.13

    - name: Install the project
      run: uv sync --all-extras --dev