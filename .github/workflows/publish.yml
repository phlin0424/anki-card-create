name: Build & Publish Python Package

on:
  push:
    branches:
      - main
jobs:
  publish:
    name: "Publish Python Package to PyPI"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: pypi-publish-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Setup
        uses: ./.github/actions/setup-project

      - name: Set up Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        shell: bash

      - name: Bump version (minor) with uv
        id: bump
        run: |
          uv version --bump patch
          # capture new version; uv prints "<name> <version>"
          NEW_VERSION=$(uv version --output-format text | awk '{print $NF}')
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Commit version bump
        run: |
          if ! git diff --quiet; then
            git add pyproject.toml
            git commit -m "chore: bump version to v${{ steps.bump.outputs.new_version }} [skip ci]"
            git tag -a "v${{ steps.bump.outputs.new_version }}" -m "Release v${{ steps.bump.outputs.new_version }}"
            git push --follow-tags
          else
            echo "No changes to commit."
          fi
        shell: bash

      - name: Build package
        shell: bash
        run: uv build

      - name: Publish to PyPI
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        shell: bash
        run: |
          if [ -z "$PYPI_TOKEN" ]; then
            echo "No PyPI token provided; skipping publish." >&2
            exit 1
          fi
          uv publish --token "$PYPI_TOKEN"
